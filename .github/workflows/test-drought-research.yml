name: Drought research tests

on:
  pull_request:
    paths:
      - 'research/remote_sensing_drought_2026/**'
      - '.github/workflows/test-drought-research.yml'
  push:
    branches:
      - 'research/mdpi-drought-validation-protocol'
    paths:
      - 'research/remote_sensing_drought_2026/**'
      - '.github/workflows/test-drought-research.yml'
  workflow_dispatch:

jobs:
  research-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/remote_sensing_drought_2026/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/remote_sensing_drought_2026/requirements.txt
      - name: Unit tests (synthetic fixtures only)
        run: python -m pytest research/remote_sensing_drought_2026/tests -q
